<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod C Weekly KPIs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#fc4a62;--orange:#fd9a5a;--yellow:#f8d94a;--green:#3cd39a;--blue:#4a7bd8;--navy:#0b5cb0;--lav:#e9e8fc;
  --bg:#f4f6fd;--panel:#ffffff;--ink:#1d2b4f;--muted:#5f6f8f;--faint:#9aa6bd;--line:#e2e8f4;--field:#f3f6fc;--fieldhover:#e8eefa;--focus:#4a7bd8;
  --hero-ink:#ffffff;--hero-glass:rgba(255,255,255,.16);--hero-glass-hover:rgba(255,255,255,.28);--hero-muted:rgba(255,255,255,.78);
  --unsw:#f2b705;--unsw-ink:#4a3500;--unsw-soft:#fff6d6;--mbs:#0b5cb0;--mbs-ink:#ffffff;--mbs-soft:#e5effb;
  --flag:#e23950;--flag-bg:#ffe9ec;--watch:#e8792b;--watch-bg:#fff1e6;--ok:#17a673;--ok-bg:#e3f8ef;--exc:#6a5be0;--exc-bg:#efedff;
  --ovr:#3d68cc;--ovr-bg:#e9e8fc;--plan:#0b5cb0;--plan-bg:#e5effb;--none:#7d89a1;--none-bg:#eff2f8;
  --shadow:0 1px 2px rgba(29,43,79,.05),0 6px 20px rgba(29,43,79,.06);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 62%,#7f8ff0 100%);color:var(--hero-ink);position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--blue),var(--navy))}
.heroin{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 34px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:52px;height:52px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted);margin:0 0 2px;font-weight:500}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekctl{display:flex;align-items:center;background:var(--hero-glass);border-radius:10px;overflow:hidden}
.weekctl button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--hero-ink);font-size:16px}
.weekctl button:hover{background:var(--hero-glass-hover)}
.weekctl label{position:relative;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.weekctl label input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.glass{background:var(--hero-glass);border:0;color:var(--hero-ink);cursor:pointer;padding:8px 12px;border-radius:10px}
.glass:hover{background:var(--hero-glass-hover)}
.me{white-space:nowrap;display:flex;align-items:center;gap:6px;background:var(--hero-glass);border-radius:10px;padding:4px 4px 4px 12px;font-size:13px;color:var(--hero-muted)}
.me select{background:var(--panel);color:var(--ink);border:0;border-radius:7px;padding:5px 8px;cursor:pointer}
.save{font-size:12px;color:var(--hero-muted);min-width:64px}
.save.err{color:#ffe1e5;font-weight:600}

.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:30px}

.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.ov{background:var(--panel);border-radius:16px;padding:18px 20px;display:grid;gap:14px;box-shadow:var(--shadow);border-top:5px solid var(--pc)}
.ov h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.ov h2 span{font-weight:400;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--sb);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--sc)}
.stat .l{font-size:12px;color:var(--muted)}
.stat.zero{background:var(--none-bg)}.stat.zero .n{color:var(--faint)}
.stat.flag{--sb:var(--flag-bg);--sc:var(--flag)}.stat.watch{--sb:var(--watch-bg);--sc:var(--watch)}.stat.ok{--sb:var(--ok-bg);--sc:var(--ok)}
.stat.override{--sb:var(--ovr-bg);--sc:var(--ovr)}.stat.plan{--sb:var(--plan-bg);--sc:var(--plan)}
.unsw{--pc:var(--unsw);--pci:var(--unsw-ink);--pcs:var(--unsw-soft)}.mbs{--pc:var(--mbs);--pci:var(--mbs-ink);--pcs:var(--mbs-soft)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--pci);background:var(--pc);border-radius:999px;padding:3px 10px;width:max-content}

.sectitle{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.sectitle::before{content:"";width:18px;height:4px;border-radius:2px;background:var(--st,var(--red))}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:start;background:var(--ab);border-left:4px solid var(--sc);border-radius:12px;padding:12px 16px}
.alert.flag{--sc:var(--flag);--ab:var(--flag-bg)}.alert.watch{--sc:var(--watch);--ab:var(--watch-bg)}.alert.override{--sc:var(--ovr);--ab:var(--ovr-bg)}
.alert .who{display:grid;gap:6px;font-weight:600}
.alert ul{margin:0;padding-left:16px;display:grid;gap:2px}
.alert .meta{font-size:12px;color:var(--muted);margin-top:4px}
.alert .why{font-style:italic}
.empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:14px 16px}

.partner{display:grid;gap:12px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead h2{margin:0;font-size:15px;font-weight:600;color:var(--pci);background:var(--pc);border-radius:999px;padding:6px 16px}
.phead .cnt{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);border-top:5px solid var(--pc)}
table{border-collapse:collapse;width:100%;min-width:1200px;table-layout:fixed}
col.c-name{width:158px}col.c-days{width:70px}col.c-calls{width:110px}col.c-uniq{width:84px}col.c-kpi{width:100px}col.c-cq{width:162px}col.c-st{width:116px}col.c-plan{width:90px}
th,td{padding:10px 10px;text-align:left;vertical-align:middle}
thead th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--pcs);line-height:1.3}
thead th small{display:block;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px;opacity:.8}
tbody tr.main td{border-top:1px solid var(--line)}
tbody tr.main:first-child td{border-top:0}
tbody tr.detail td,tbody tr.crow td{padding-top:0;padding-bottom:12px}
td.name{font-weight:600}
.f{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.f .of{font-size:12px;color:var(--faint);white-space:nowrap}
.f .of.short{color:var(--watch);font-weight:500}
.f .pct{font-size:12px;color:var(--faint)}
input.num{width:58px;background:var(--field);border:1px solid transparent;border-radius:8px;padding:6px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums;transition:background .12s}
input.num.days{width:48px}
input.num:hover{background:var(--fieldhover)}
input.num:focus,input.txt:focus{background:var(--panel);border-color:var(--focus);outline:none}
select{width:100%;background:var(--field);border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer}
select:hover{background:var(--fieldhover)}
.t-flag{background:var(--flag-bg)!important;color:var(--flag)}
.t-ok{background:var(--ok-bg)!important;color:var(--ok)}
.t-exc{background:var(--exc-bg)!important;color:var(--exc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--pb);color:var(--pt)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.flag{--pb:var(--flag-bg);--pt:var(--flag)}.pill.watch{--pb:var(--watch-bg);--pt:var(--watch)}.pill.ok{--pb:var(--ok-bg);--pt:var(--ok)}
.pill.override{--pb:var(--ovr-bg);--pt:var(--ovr)}
.pill.none,.pill.leave,.pill.part{--pb:var(--none-bg);--pt:var(--none)}
.streak{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.planbox{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px}
.planbox input{width:16px;height:16px;accent-color:var(--flag);cursor:pointer}
.planbox:has(input:checked){color:var(--flag);font-weight:600}

.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:start}
textarea{width:100%;min-height:34px;resize:none;overflow:hidden;background:var(--field);border:1px solid transparent;border-radius:8px;padding:7px 10px;color:var(--ink);line-height:1.45}
textarea::placeholder,input.txt::placeholder{color:var(--faint)}
textarea:hover{background:var(--fieldhover)}
textarea:focus{background:var(--panel);border-color:var(--focus);outline:none}
.ovbox{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:8px;padding:4px 6px 4px 10px;min-height:34px}
.ovbox.on{background:var(--ovr-bg)}
.ovbox.off{opacity:.55}
.ovtoggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.ovbox.on .ovtoggle{color:var(--ovr);font-weight:600}
.ovtoggle input{width:16px;height:16px;accent-color:var(--ovr);cursor:pointer}
.ovbox.off .ovtoggle{cursor:not-allowed}
input.txt{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:240px}
input.txt.need{border-color:var(--ovr);box-shadow:0 0 0 3px var(--ovr-bg)}
.ovhint{font-size:11px;color:var(--ovr);white-space:nowrap}
.cbtn{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;min-height:34px}
.cbtn:hover{background:var(--fieldhover);color:var(--ink)}
.cbtn.open{background:var(--plan-bg);color:var(--plan);font-weight:600}
.cbtn b{background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}

.thread{background:linear-gradient(180deg,var(--lav),var(--panel));border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.cm{display:grid;gap:3px;background:var(--panel);border-radius:10px;padding:8px 12px;box-shadow:0 1px 2px rgba(29,43,79,.05)}
.cmh{display:flex;align-items:center;gap:8px;font-size:13px}
.av{width:22px;height:22px;border-radius:50%;background:var(--av);color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.when{color:var(--faint);font-size:12px}
.cdel{margin-left:auto;background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px}
.cdel:hover{color:var(--flag);background:var(--flag-bg)}
.cmt{white-space:pre-wrap;padding-left:30px}
.cempty{color:var(--muted);font-size:13px}
.cnew{display:flex;gap:8px}
.cnew input{flex:1;min-width:0;width:auto}
.cpost{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:6px 16px;cursor:pointer;font-weight:600}
.cpost:hover{background:var(--navy)}

.legend{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:720px){.alert{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:22px}.detailgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="heroin">
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M256 256L256 0A256 256 0 0 1 437 75Z" fill="#f8e46a"/><path d="M256 256L437 75A256 256 0 0 1 512 256Z" fill="#3cd39a"/><path d="M256 256L512 256A256 256 0 0 1 384 477.7Z" fill="#4a7bd8"/><path d="M256 256L384 477.7A256 256 0 0 1 0 256Z" fill="#0b5cb0"/><path d="M256 256L0 256A256 256 0 0 1 75 75Z" fill="#fc4a62"/><path d="M256 256L75 75A256 256 0 0 1 189.7 8.7Z" fill="#fd9a5a"/><path d="M256 256L189.7 8.7A256 256 0 0 1 256 0Z" fill="#fdbe74"/><circle cx="256" cy="256" r="168" fill="#e9e8fc"/><polyline points="205,200 255,250 382,124" fill="none" stroke="#4a76d6" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><text x="256" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="96" letter-spacing="6" fill="#4a76d6">KPI</text></svg>
      <div>
        <p class="eyebrow">Pod C &middot; Student Success</p>
        <h1>Weekly KPI review</h1>
      </div>
    </div>
    <div class="controls">
      <div class="weekctl">
        <button id="prev" aria-label="Previous week">&#8249;</button>
        <label><span id="weeklabel"></span><input type="date" id="weekpick" aria-label="Pick a week"></label>
        <button id="next" aria-label="Next week">&#8250;</button>
      </div>
      <button class="glass" id="thisweek">This week</button>
      <button class="glass" id="refresh">Refresh</button>
      <label class="me">Commenting as
        <select id="me"><option value="">Choose name</option></select>
      </label>
      <span class="save" id="save"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="overview" id="overview"></section>

  <section>
    <p class="sectitle">Needs attention</p>
    <div class="alerts" id="alerts"></div>
  </section>

  <section id="ovsec" hidden>
    <p class="sectitle" style="--st:var(--ovr)">Override applied</p>
    <div class="alerts" id="overrides"></div>
  </section>

  <div id="partners" style="display:grid;gap:34px"></div>

  <div class="legend">
    <span><i class="sw" style="background:var(--flag)"></i>Flag: an FY27 KPI is in Support Needed</span>
    <span><i class="sw" style="background:var(--watch)"></i>Watch: call attempts or vCITA below the minimum for days worked</span>
    <span><i class="sw" style="background:var(--ovr)"></i>Overridden: a reason has been accepted</span>
    <span><i class="sw" style="background:var(--ok)"></i>On track, Achieved Expectations</span>
    <span><i class="sw" style="background:var(--exc)"></i>Exceptional Performance</span>
  </div>
</div>

<script>
const ROOT = 'https://unsw-team-calendar-default-rtdb.asia-southeast1.firebasedatabase.app';
const DB = ROOT + '/weekly_kpi', DBC = ROOT + '/weekly_kpi_comments';
const MANAGERS = [{name:'Greg Banks', colour:'var(--blue)'}, {name:'Carmela Gomez', colour:'var(--red)'}];
const PARTNERS = [
  {id:'unsw', book:'UNSW', name:'UNSW Online'},
  {id:'mbs', book:'MBS', name:'Melbourne Business School'}
];
const ADVISERS = [
  {name:'Amelia Churchill', book:'UNSW'},
  {name:'Daljeet Sahota', book:'UNSW'},
  {name:'James Miller', book:'UNSW'},
  {name:'Kimberley Hornlimann', book:'UNSW'},
  {name:'Priscilla Samuel', book:'UNSW'},
  {name:'Andrew', book:'UNSW'},
  {name:'Steph', book:'UNSW'},
  {name:'Ananya Rao', book:'MBS'},
  {name:'Emma Arjoon', book:'MBS'},
  {name:'Inuri Nethisinghe', book:'MBS'}
];
const MIN_ATTEMPTS = 15, MIN_VCITA = 10;
const KPI = {
  att:{label:'60-Day Attempted', floor:80, ceil:90},
  con:{label:'60-Day Contacted', floor:45, ceil:55},
  t12:{label:'T1 to T2', floor:75, ceil:85}
};
const CQ = ['', 'Support Needed', 'Achieved Expectations', 'Exceptional Performance'];
const CQ_SHORT = {'':'Not rated', 'Support Needed':'Support Needed', 'Achieved Expectations':'Achieved', 'Exceptional Performance':'Exceptional'};

let all = {}, comments = {};
let week = mondayOf(new Date());
const timers = {};
const openC = new Set();
const drafts = {};
let focusNext = null, liveTimer = null;
let me = '';
try{ me = localStorage.getItem('podc_me') || ''; }catch(e){}

const key = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '_');
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const g = (x.getDay() + 6) % 7; x.setDate(x.getDate() - g); return x; }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmt(d){ return d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'}); }
function when(s){ const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('en-AU', {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }
const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => String(n || '?').split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
const avColour = n => (MANAGERS.find(m => m.name === n) || {colour:'var(--green)'}).colour;

function setSave(t, err){ const el = document.getElementById('save'); el.textContent = t; el.className = 'save' + (err ? ' err' : ''); }

let store = null, unsub = null, cunsub = null;
const pending = new Set();
const chains = {};
let dirty = false;

function typing(){ const a = document.activeElement; return !!(a && a.dataset && a.dataset.k && (a.tagName === 'TEXTAREA' || a.type === 'number' || a.type === 'text')); }
function refresh(){ if(typing()) dirty = true; else render(); }

async function init(){
  const sel = document.getElementById('me');
  MANAGERS.forEach(m => { const o = document.createElement('option'); o.value = m.name; o.textContent = m.name; sel.appendChild(o); });
  sel.value = me;
  sel.onchange = () => { me = sel.value; try{ localStorage.setItem('podc_me', me); }catch(e){} render(); };
  if(window.claude && typeof window.claude.use === 'function'){
    setSave('Connecting...');
    try{ store = await window.claude.use('db'); }catch(e){ store = null; }
    if(store){ subscribe(); return; }
    setSave('Read only', true);
    render();
    return;
  }
  load();
  setInterval(() => { if(!typing() && document.visibilityState === 'visible') load(true); }, 60000);
}

function subscribe(){
  if(unsub) unsub();
  if(cunsub) cunsub();
  unsub = store.collection('entries').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const b = d.data() || {}; if(!b.wk || !b.k) return; (next[b.wk] = next[b.wk] || {})[b.k] = Object.assign({}, b); });
    pending.forEach(id => { const [wk, k] = id.split('|'); if(all[wk] && all[wk][k]) (next[wk] = next[wk] || {})[k] = all[wk][k]; });
    all = next;
    if(document.getElementById('save').textContent === 'Connecting...') setSave('');
    refresh();
  }, () => setSave('Connection lost, reload the page', true));
  cunsub = store.collection('comments').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => {
      const b = d.data() || {};
      if(!b.wk || !b.k) return;
      next[b.wk] = next[b.wk] || {};
      (next[b.wk][b.k] = next[b.wk][b.k] || []).push({id:d.id, by:b.by, at:b.at, text:b.text});
    });
    comments = next;
    refresh();
  }, () => {});
}

async function load(quiet){
  if(store){ render(); return; }
  if(!quiet) setSave('Loading...');
  try{
    const [r, c] = await Promise.all([fetch(DB + '.json', {cache:'no-store'}), fetch(DBC + '.json', {cache:'no-store'})]);
    if(!r.ok || !c.ok) throw new Error('load');
    const next = (await r.json()) || {};
    pending.forEach(id => { const [wk, k] = id.split('|'); if(all[wk] && all[wk][k]) (next[wk] = next[wk] || {})[k] = all[wk][k]; });
    all = next;
    const raw = (await c.json()) || {};
    const cm = {};
    Object.keys(raw).forEach(wk => Object.keys(raw[wk] || {}).forEach(k => {
      cm[wk] = cm[wk] || {};
      cm[wk][k] = Object.entries(raw[wk][k] || {}).map(([id, v]) => Object.assign({id}, v));
    }));
    comments = cm;
    if(!quiet) setSave('');
  }catch(e){ setSave('Could not load', true); }
  refresh();
}

function rec(wk, a){ return ((all[wk] || {})[key(a.name)]) || {}; }
function cmts(wk, k){ return ((comments[wk] || {})[k] || []).slice().sort((x, y) => String(x.at).localeCompare(String(y.at))); }

function hasData(r){ return ['days','attempts','vcita','unique','att','con','t12','cq','notes'].some(k => r[k] !== undefined && r[k] !== '' && r[k] !== null); }

function tier(k, v){ if(v === null) return ''; const t = KPI[k]; return v < t.floor ? 'flag' : v > t.ceil ? 'exc' : 'ok'; }

function assess(r){
  const reasons = {flag:[], watch:[]};
  if(!hasData(r)) return {status:'none', base:'none', reasons};
  const days = num(r.days);
  if(days === 0) return {status:'leave', base:'leave', reasons};
  ['att','con','t12'].forEach(k => { const v = num(r[k]); if(v !== null && v < KPI[k].floor) reasons.flag.push(`${KPI[k].label} ${v}% (below ${KPI[k].floor}%)`); });
  if(r.cq === 'Support Needed') reasons.flag.push('Call Quality rated Support Needed');
  if(days !== null){
    const a = num(r.attempts), v = num(r.vcita);
    if(a !== null && a < MIN_ATTEMPTS * days) reasons.watch.push(`Call attempts ${a} of ${MIN_ATTEMPTS * days} expected (${days} days)`);
    if(v !== null && v < MIN_VCITA * days) reasons.watch.push(`vCITA calls ${v} of ${MIN_VCITA * days} expected (${days} days)`);
  }
  const missing = days === null || num(r.attempts) === null || num(r.vcita) === null;
  const base = reasons.flag.length ? 'flag' : reasons.watch.length ? 'watch' : missing ? 'part' : 'ok';
  const below = base === 'flag' || base === 'watch';
  const status = below && r.override && String(r.ovReason || '').trim() ? 'override' : base;
  return {status, base, reasons};
}

function streak(a){
  let n = 0, d = new Date(week);
  while(true){
    const s = assess(rec(iso(d), a)).status;
    if(s === 'flag' || s === 'watch'){ n++; d = addDays(d, -7); } else break;
  }
  return n;
}

const LABEL = {flag:'Flag', watch:'Watch', ok:'On track', override:'Overridden', part:'Incomplete', none:'No data', leave:'On leave'};

const COLS = `<colgroup><col class="c-name"><col class="c-days"><col class="c-calls"><col class="c-calls"><col class="c-uniq"><col class="c-kpi"><col class="c-kpi"><col class="c-kpi"><col class="c-cq"><col class="c-st"><col class="c-plan"></colgroup>`;
const HEAD = `<thead><tr>
  <th>Adviser</th>
  <th>Days<small>worked</small></th>
  <th>Call attempts<small>min 15 a day</small></th>
  <th>vCITA calls<small>min 10 a day</small></th>
  <th>Unique<small>contacts</small></th>
  <th>Attempted<small>60-day, min 80%</small></th>
  <th>Contacted<small>60-day, min 45%</small></th>
  <th>T1 to T2<small>min 75%</small></th>
  <th>Call Quality<small>tier</small></th>
  <th>Status</th>
  <th>Success plan</th>
</tr></thead>`;

function rowHtml(a, k, r, res, st, wk){
  const {status, base} = res;
  const days = num(r.days);
  const expA = days ? MIN_ATTEMPTS * days : null, expV = days ? MIN_VCITA * days : null;
  const shortA = expA !== null && num(r.attempts) !== null && num(r.attempts) < expA;
  const shortV = expV !== null && num(r.vcita) !== null && num(r.vcita) < expV;
  const kcls = f => { const t = tier(f, num(r[f])); return t ? 't-' + t : ''; };
  const cqcls = r.cq === 'Support Needed' ? 't-flag' : r.cq === 'Exceptional Performance' ? 't-exc' : r.cq === 'Achieved Expectations' ? 't-ok' : '';
  const kpi = f => `<span class="f"><input class="num ${kcls(f)}" type="number" min="0" max="100" step="0.1" data-f="${f}" value="${esc(r[f])}"><span class="pct">%</span></span>`;
  const below = base === 'flag' || base === 'watch';
  const canOv = below || !!r.override;
  const needReason = !!r.override && !String(r.ovReason || '').trim();
  const list = cmts(wk, k);
  const open = openC.has(k);
  let html = `<tr class="main" data-row="${k}">
    <td class="name">${esc(a.name)}</td>
    <td><span class="f"><input class="num days" type="number" min="0" max="5" step="0.5" data-f="days" value="${esc(r.days)}"></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="attempts" value="${esc(r.attempts)}"><span class="of ${shortA ? 'short' : ''}">${expA !== null ? '/ ' + expA : ''}</span></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="vcita" value="${esc(r.vcita)}"><span class="of ${shortV ? 'short' : ''}">${expV !== null ? '/ ' + expV : ''}</span></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="unique" value="${esc(r.unique)}"></span></td>
    <td>${kpi('att')}</td><td>${kpi('con')}</td><td>${kpi('t12')}</td>
    <td><select class="${cqcls}" data-f="cq" aria-label="Call Quality tier">${CQ.map(o => `<option value="${o}" ${r.cq === o ? 'selected' : ''}>${CQ_SHORT[o]}</option>`).join('')}</select></td>
    <td><span class="pill ${status}">${LABEL[status]}</span>${status === 'override' ? `<span class="streak">Was ${LABEL[base]}</span>` : st > 1 ? `<span class="streak">${st} weeks in a row</span>` : ''}</td>
    <td><label class="planbox"><input type="checkbox" data-f="plan" ${r.plan ? 'checked' : ''}> Needed</label></td>
  </tr>
  <tr class="detail" data-row="${k}"><td></td><td colspan="10"><div class="detailgrid">
    <textarea rows="1" data-f="notes" placeholder="Add notes, risks or agreed actions">${esc(r.notes)}</textarea>
    <div class="ovbox ${r.override ? 'on' : ''} ${canOv ? '' : 'off'}" title="${canOv ? '' : 'Available when an adviser is on Flag or Watch'}">
      <label class="ovtoggle"><input type="checkbox" data-f="override" ${r.override ? 'checked' : ''} ${canOv ? '' : 'disabled'}> Override</label>
      ${r.override ? `<input class="txt ${needReason ? 'need' : ''}" type="text" data-f="ovReason" placeholder="Reason (required)" value="${esc(r.ovReason)}">` : ''}
      ${needReason ? '<span class="ovhint">Add a reason to apply</span>' : ''}
    </div>
    <button class="cbtn ${open ? 'open' : ''}" data-toggle="${k}">Comments${list.length ? ` <b>${list.length}</b>` : ''}</button>
  </div></td></tr>`;
  if(open){
    html += `<tr class="crow" data-row="${k}"><td></td><td colspan="10"><div class="thread">
      ${list.length ? list.map(c => `<div class="cm"><div class="cmh"><span class="av" style="--av:${avColour(c.by)}">${esc(initials(c.by))}</span><b>${esc(c.by)}</b><span class="when">${esc(when(c.at))}</span>${c.by === me ? `<button class="cdel" data-del="${esc(c.id)}">Remove</button>` : ''}</div><div class="cmt">${esc(c.text)}</div></div>`).join('') : '<div class="cempty">No comments for this week yet.</div>'}
      <div class="cnew"><input class="txt" type="text" data-f="cdraft" placeholder="${me ? 'Write a comment as ' + esc(me) : 'Choose your name at the top to comment'}" value="${esc(drafts[k] || '')}"><button class="cpost" data-post="${k}">Post</button></div>
    </div></td></tr>`;
  }
  return html;
}

function bind(sec){
  sec.querySelectorAll('[data-f]').forEach(el => {
    const k = el.closest('tr').dataset.row;
    el.dataset.k = k;
    const f = el.dataset.f;
    if(f === 'cdraft'){
      el.addEventListener('input', () => { drafts[k] = el.value; });
      el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); postComment(k); } });
      return;
    }
    const ev = (el.tagName === 'TEXTAREA' || el.type === 'number' || el.type === 'text') ? 'input' : 'change';
    el.addEventListener(ev, () => onEdit(k, el));
    if(el.type === 'number' || el.type === 'text') el.addEventListener('change', () => render());
    if(el.type === 'number') el.addEventListener('input', () => { clearTimeout(liveTimer); liveTimer = setTimeout(render, 350); });
    if(el.tagName === 'TEXTAREA'){ fit(el); el.addEventListener('input', () => fit(el)); }
  });
  sec.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { const k = b.dataset.toggle; openC.has(k) ? openC.delete(k) : openC.add(k); if(openC.has(k)) focusNext = {k, f:'cdraft'}; render(); });
  sec.querySelectorAll('[data-post]').forEach(b => b.onclick = () => postComment(b.dataset.post));
  sec.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteComment(b.closest('tr').dataset.row, b.dataset.del));
}

function render(){
  const ae = document.activeElement;
  const keep = focusNext || (ae && ae.dataset && ae.dataset.k ? {k:ae.dataset.k, f:ae.dataset.f} : null);
  focusNext = null;
  const wk = iso(week);
  document.getElementById('weeklabel').textContent = 'Week of ' + fmt(week);
  document.getElementById('weekpick').value = wk;

  const alerts = [], overs = [];
  const summary = {};
  const partnersEl = document.getElementById('partners');
  partnersEl.innerHTML = '';

  PARTNERS.forEach(p => {
    const list = ADVISERS.filter(a => a.book === p.book);
    const c = summary[p.id] = {flag:0, watch:0, ok:0, override:0, plan:0, n:list.length};
    let rows = '';
    list.forEach(a => {
      const k = key(a.name);
      const r = rec(wk, a);
      const res = assess(r);
      if(c[res.status] !== undefined) c[res.status]++;
      if(r.plan) c.plan++;
      const st = (res.status === 'flag' || res.status === 'watch') ? streak(a) : 0;
      const n = cmts(wk, k).length;
      if(res.status === 'flag' || res.status === 'watch') alerts.push({a, p, res, st, plan:r.plan, n});
      if(res.status === 'override') overs.push({a, p, res, r, n});
      rows += rowHtml(a, k, r, res, st, wk);
    });
    const sec = document.createElement('section');
    sec.className = 'partner ' + p.id;
    sec.innerHTML = `<div class="phead"><h2>${p.name}</h2><span class="cnt">${list.length} advisers</span></div>
      <div class="tablewrap"><table>${COLS}${HEAD}<tbody>${rows}</tbody></table></div>`;
    bind(sec);
    partnersEl.appendChild(sec);
  });

  const stat = (n, l, cls) => `<div class="stat ${cls} ${n ? '' : 'zero'}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  document.getElementById('overview').innerHTML = PARTNERS.map(p => {
    const c = summary[p.id];
    return `<div class="ov ${p.id}"><h2><span class="chip">${p.book}</span>${p.name}<span>${c.n} advisers</span></h2><div class="stats">
      ${stat(c.flag, 'Flag', 'flag')}${stat(c.watch, 'Watch', 'watch')}${stat(c.override, 'Overridden', 'override')}${stat(c.ok, 'On track', 'ok')}${stat(c.plan, 'Success plans', 'plan')}</div></div>`;
  }).join('');

  const metaLine = parts => { const s = parts.filter(Boolean).join(' &middot; '); return s ? `<div class="meta">${s}</div>` : ''; };
  alerts.sort((x, y) => (x.res.status === 'flag' ? 0 : 1) - (y.res.status === 'flag' ? 0 : 1) || PARTNERS.indexOf(x.p) - PARTNERS.indexOf(y.p));
  document.getElementById('alerts').innerHTML = alerts.length
    ? alerts.map(x => `<div class="alert ${x.res.status}">
        <div class="who">${esc(x.a.name)}<span class="chip ${x.p.id}">${x.p.book}</span></div>
        <div><ul>${[...x.res.reasons.flag, ...x.res.reasons.watch].map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        ${metaLine([x.st > 1 ? x.st + ' weeks in a row' : '', x.plan ? 'Success plan marked as needed' : '', x.n ? x.n + (x.n === 1 ? ' comment' : ' comments') : ''])}</div>
      </div>`).join('')
    : ADVISERS.every(a => !hasData(rec(wk, a)))
      ? '<div class="empty">No figures entered for this week yet. Type each adviser\'s numbers into the tables below and they save as you go.</div>'
      : '<div class="empty">Nobody is below expectation this week.</div>';

  document.getElementById('ovsec').hidden = !overs.length;
  document.getElementById('overrides').innerHTML = overs.map(x => `<div class="alert override">
      <div class="who">${esc(x.a.name)}<span class="chip ${x.p.id}">${x.p.book}</span></div>
      <div><div class="why">&ldquo;${esc(x.r.ovReason)}&rdquo;</div>
      ${metaLine(['Would have been ' + LABEL[x.res.base], x.r.ovBy ? 'Override by ' + esc(x.r.ovBy) : '', x.n ? x.n + (x.n === 1 ? ' comment' : ' comments') : ''])}</div>
    </div>`).join('');

  if(keep){ const el = partnersEl.querySelector(`[data-k="${keep.k}"][data-f="${keep.f}"]`); if(el) el.focus(); }
}

function fit(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }

function onEdit(k, el){
  const wk = iso(week);
  all[wk] = all[wk] || {};
  const r = all[wk][k] = all[wk][k] || {};
  const f = el.dataset.f;
  r[f] = el.type === 'checkbox' ? el.checked : el.value;
  if(f === 'override'){
    if(el.checked){ r.ovBy = me || ''; focusNext = {k, f:'ovReason'}; }
  }
  if(el.tagName === 'SELECT' || el.type === 'checkbox') render();
  setSave('Saving...');
  const id = wk + '|' + k;
  pending.add(id);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => persist(wk, k), 600);
}

async function persist(wk, k){
  const id = wk + '|' + k;
  if(store){
    const body = Object.assign({}, all[wk][k], {wk, k});
    chains[id] = (chains[id] || Promise.resolve()).then(() => store.collection('entries').doc(wk + '_' + k).set(body))
      .then(() => { pending.delete(id); setSave('Saved'); })
      .catch(e => setSave(e && e.code === 'invalid_argument' ? 'You have view-only access' : 'Not saved', true));
    return;
  }
  try{
    const r = await fetch(`${DB}/${wk}/${k}.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(all[wk][k])});
    if(!r.ok) throw new Error(r.status);
    pending.delete(id);
    setSave('Saved');
  }catch(e){ setSave('Not saved', true); }
}

async function postComment(k){
  const wk = iso(week);
  const text = (drafts[k] || '').trim();
  if(!text) return;
  if(!me){ setSave('Choose your name first', true); document.getElementById('me').focus(); return; }
  const c = {by:me, at:new Date().toISOString(), text};
  drafts[k] = '';
  try{
    if(store){
      await store.collection('comments').add(Object.assign({wk, k}, c));
    }else{
      const r = await fetch(`${DBC}/${wk}/${k}.json`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(c)});
      if(!r.ok) throw new Error(r.status);
      const {name} = await r.json();
      comments[wk] = comments[wk] || {};
      (comments[wk][k] = comments[wk][k] || []).push(Object.assign({id:name}, c));
    }
    setSave('Comment posted');
    focusNext = {k, f:'cdraft'};
    render();
  }catch(e){ drafts[k] = text; setSave('Comment not posted', true); }
}

async function deleteComment(k, id){
  const wk = iso(week);
  try{
    if(store){ await store.collection('comments').doc(id).delete(); }
    else{
      const r = await fetch(`${DBC}/${wk}/${k}/${id}.json`, {method:'DELETE'});
      if(!r.ok) throw new Error(r.status);
      comments[wk][k] = (comments[wk][k] || []).filter(c => c.id !== id);
    }
    setSave('Comment removed');
    render();
  }catch(e){ setSave('Could not remove comment', true); }
}

function go(d){ week = mondayOf(d); render(); }
document.getElementById('prev').onclick = () => go(addDays(week, -7));
document.getElementById('next').onclick = () => go(addDays(week, 7));
document.getElementById('thisweek').onclick = () => go(new Date());
document.getElementById('refresh').onclick = () => load();
document.getElementById('weekpick').onchange = e => { if(e.target.value){ const [y,m,d] = e.target.value.split('-').map(Number); go(new Date(y, m-1, d)); } };
document.getElementById('partners').addEventListener('focusout', () => setTimeout(() => { if(dirty && !typing()){ dirty = false; render(); } }, 0));

init();
</script>
</body>
</html>
