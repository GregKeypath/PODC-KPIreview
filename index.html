<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod C Weekly KPIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb;--bg-top:#e6eefb;--panel:#ffffff;--ink:#22304a;--muted:#66758c;--faint:#a0abbb;--line:#e3e9f2;--field:#f4f7fb;--fieldhover:#eaf0f8;--focus:#4a6cf7;
  --unsw:#c9930a;--unsw-soft:#fff7e3;--mbs:#7a52c7;--mbs-soft:#f5f0fd;
  --flag:#d6453d;--flag-bg:#fff0ee;--watch:#d97a12;--watch-bg:#fff5e8;--ok:#21945a;--ok-bg:#eaf8f0;--exc:#3f6ae0;--exc-bg:#edf2fe;--none:#8792a3;--none-bg:#f1f4f8;
  --shadow:0 1px 2px rgba(34,48,74,.04),0 4px 16px rgba(34,48,74,.05);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 340px) var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:36px 64px;display:grid;gap:28px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weekctl{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.weekctl button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted)}
.weekctl button:hover{background:var(--field);color:var(--ink)}
.weekctl label{position:relative;padding:8px 14px;border-inline:1px solid var(--line);font-weight:500;cursor:pointer;white-space:nowrap}
.weekctl label input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 6px;border-radius:8px}
.ghost:hover{color:var(--ink);background:var(--field)}
.save{font-size:12px;color:var(--faint);min-width:64px}
.save.err{color:var(--flag)}

.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ov{background:linear-gradient(135deg,var(--pcs),var(--panel) 70%);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:18px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.ov::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--pc)}
.ov h2{margin:0;font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.ov h2 span{font-weight:400;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat.flag .n{color:var(--flag)}.stat.watch .n{color:var(--watch)}.stat.ok .n{color:var(--ok)}
.stat .n.zero{color:var(--faint)}
.unsw{--pc:var(--unsw);--pcs:var(--unsw-soft)}.mbs{--pc:var(--mbs);--pcs:var(--mbs-soft)}

.sectitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px}
.alert.flag{--sc:var(--flag)}.alert.watch{--sc:var(--watch)}
.alert .who{display:grid;gap:4px;font-weight:600}
.alert ul{margin:0;padding-left:16px;display:grid;gap:2px}
.alert .meta{font-size:12px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:14px 16px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--pc);background:var(--pcs);border-radius:999px;padding:2px 8px;width:max-content}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc)}

.partner{display:grid;gap:12px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.phead h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--pc)}
.phead .cnt{color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-top:3px solid var(--pc);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1200px;table-layout:fixed}
col.c-name{width:170px}col.c-days{width:70px}col.c-calls{width:110px}col.c-uniq{width:84px}col.c-kpi{width:100px}col.c-cq{width:150px}col.c-st{width:116px}col.c-plan{width:90px}
th,td{padding:10px 10px;text-align:left;vertical-align:middle}
thead th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--pcs);line-height:1.3}
thead th small{display:block;text-transform:none;letter-spacing:0;color:var(--faint);font-size:11px;margin-top:2px}
tbody tr.main td{border-top:1px solid var(--line)}
tbody tr.main:first-child td{border-top:0}
tbody tr.noterow td{padding-top:0;padding-bottom:12px}
td.name{font-weight:500}
td.name small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.f{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.f .of{font-size:12px;color:var(--faint);white-space:nowrap}
.f .of.short{color:var(--watch);font-weight:500}
.f .pct{font-size:12px;color:var(--faint)}
input.num{width:58px;background:var(--field);border:1px solid transparent;border-radius:7px;padding:6px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums;transition:background .12s}
input.num.days{width:48px}
input.num:hover{background:var(--fieldhover)}
input.num:focus{background:var(--panel);border-color:var(--focus);outline:none}
select{width:100%;background:var(--field);border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer}
select:hover{background:var(--fieldhover)}
.t-flag{background:var(--flag-bg)!important;color:var(--flag)}
.t-ok{background:var(--ok-bg)!important;color:var(--ok)}
.t-exc{background:var(--exc-bg)!important;color:var(--exc)}
textarea{width:100%;min-height:32px;resize:none;overflow:hidden;background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;color:var(--ink);line-height:1.45}
textarea::placeholder{color:var(--faint)}
textarea:hover{background:var(--field)}
textarea:focus{background:var(--panel);border-color:var(--focus);outline:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--pb);color:var(--pt)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.flag{--pb:var(--flag-bg);--pt:var(--flag)}.pill.watch{--pb:var(--watch-bg);--pt:var(--watch)}.pill.ok{--pb:var(--ok-bg);--pt:var(--ok)}
.pill.none,.pill.leave,.pill.part{--pb:var(--none-bg);--pt:var(--none)}
.streak{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.planbox{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px}
.planbox input{width:16px;height:16px;accent-color:var(--flag);cursor:pointer}
.planbox:has(input:checked){color:var(--flag);font-weight:500}

.legend{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){.alert{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Pod C &middot; Student Success</p>
      <h1>Weekly KPI review</h1>
    </div>
    <div class="controls">
      <div class="weekctl">
        <button id="prev" aria-label="Previous week">&#8249;</button>
        <label><span id="weeklabel"></span><input type="date" id="weekpick" aria-label="Pick a week"></label>
        <button id="next" aria-label="Next week">&#8250;</button>
      </div>
      <button class="ghost" id="thisweek">This week</button>
      <button class="ghost" id="refresh">Refresh</button>
      <span class="save" id="save"></span>
    </div>
  </header>

  <section class="overview" id="overview"></section>

  <section>
    <p class="sectitle">Needs attention</p>
    <div class="alerts" id="alerts"></div>
  </section>

  <div id="partners" style="display:grid;gap:32px"></div>

  <div class="legend">
    <span><i class="sw" style="background:var(--flag)"></i>Flag: an FY27 KPI is in Support Needed</span>
    <span><i class="sw" style="background:var(--watch)"></i>Watch: call attempts or vCITA below the minimum for days worked</span>
    <span><i class="sw" style="background:var(--ok)"></i>On track, Achieved Expectations</span>
    <span><i class="sw" style="background:var(--exc)"></i>Exceptional Performance</span>
  </div>
</div>

<script>
const DB = 'https://unsw-team-calendar-default-rtdb.asia-southeast1.firebasedatabase.app/weekly_kpi';
const PARTNERS = [
  {id:'unsw', book:'UNSW', name:'UNSW Online'},
  {id:'mbs', book:'MBS', name:'Melbourne Business School'}
];
const ADVISERS = [
  {name:'Amelia Churchill', book:'UNSW'},
  {name:'Daljeet Sahota', book:'UNSW'},
  {name:'James Miller', book:'UNSW'},
  {name:'Kimberley Hornlimann', book:'UNSW'},
  {name:'Priscilla Samuel', book:'UNSW'},
  {name:'Andrew', book:'UNSW'},
  {name:'Steph', book:'UNSW'},
  {name:'Ananya Rao', book:'MBS'},
  {name:'Emma Arjoon', book:'MBS'},
  {name:'Inuri Nethisinghe', book:'MBS'}
];
const MIN_ATTEMPTS = 15, MIN_VCITA = 10;
const KPI = {
  att:{label:'60-Day Attempted', floor:80, ceil:90},
  con:{label:'60-Day Contacted', floor:45, ceil:55},
  t12:{label:'T1 to T2', floor:75, ceil:85}
};
const CQ = ['', 'Support Needed', 'Achieved Expectations', 'Exceptional Performance'];
const CQ_SHORT = {'':'Not rated', 'Support Needed':'Support Needed', 'Achieved Expectations':'Achieved', 'Exceptional Performance':'Exceptional'};

let all = {};
let week = mondayOf(new Date());
const timers = {};

const key = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '_');
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const g = (x.getDay() + 6) % 7; x.setDate(x.getDate() - g); return x; }
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmt(d){ return d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'}); }
const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid = book => PARTNERS.find(p => p.book === book).id;

function setSave(t, err){ const el = document.getElementById('save'); el.textContent = t; el.className = 'save' + (err ? ' err' : ''); }

let store = null, unsub = null;
const pending = new Set();
const chains = {};
let dirty = false;

function typing(){ const a = document.activeElement; return a && a.dataset && a.dataset.k && (a.tagName === 'TEXTAREA' || a.type === 'number'); }

async function init(){
  if(window.claude && typeof window.claude.use === 'function'){
    setSave('Connecting...');
    try{ store = await window.claude.use('db'); }catch(e){ store = null; }
    if(store){ subscribe(); return; }
    setSave('Read only', true);
    render();
    return;
  }
  load();
}

function subscribe(){
  if(unsub) unsub();
  unsub = store.collection('entries').onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const b = d.data() || {}; if(!b.wk || !b.k) return; (next[b.wk] = next[b.wk] || {})[b.k] = Object.assign({}, b); });
    pending.forEach(id => { const [wk, k] = id.split('|'); if(all[wk] && all[wk][k]) (next[wk] = next[wk] || {})[k] = all[wk][k]; });
    all = next;
    if(document.getElementById('save').textContent === 'Connecting...') setSave('');
    if(typing()) dirty = true; else render();
  }, () => setSave('Connection lost, reload the page', true));
}

async function load(){
  if(store){ subscribe(); return; }
  setSave('Loading...');
  try{
    const r = await fetch(DB + '.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    all = (await r.json()) || {};
    setSave('');
  }catch(e){ setSave('Could not load', true); }
  render();
}

function rec(wk, a){ return ((all[wk] || {})[key(a.name)]) || {}; }

function hasData(r){ return ['days','attempts','vcita','unique','att','con','t12','cq','notes'].some(k => r[k] !== undefined && r[k] !== '' && r[k] !== null); }

function tier(k, v){ if(v === null) return ''; const t = KPI[k]; return v < t.floor ? 'flag' : v > t.ceil ? 'exc' : 'ok'; }

function assess(r){
  const reasons = {flag:[], watch:[]};
  if(!hasData(r)) return {status:'none', reasons};
  const days = num(r.days);
  if(days === 0) return {status:'leave', reasons};
  ['att','con','t12'].forEach(k => { const v = num(r[k]); if(v !== null && v < KPI[k].floor) reasons.flag.push(`${KPI[k].label} ${v}% (below ${KPI[k].floor}%)`); });
  if(r.cq === 'Support Needed') reasons.flag.push('Call Quality rated Support Needed');
  if(days !== null){
    const a = num(r.attempts), v = num(r.vcita);
    if(a !== null && a < MIN_ATTEMPTS * days) reasons.watch.push(`Call attempts ${a} of ${MIN_ATTEMPTS * days} expected (${days} days)`);
    if(v !== null && v < MIN_VCITA * days) reasons.watch.push(`vCITA calls ${v} of ${MIN_VCITA * days} expected (${days} days)`);
  }
  const missing = days === null || num(r.attempts) === null || num(r.vcita) === null;
  const status = reasons.flag.length ? 'flag' : reasons.watch.length ? 'watch' : missing ? 'part' : 'ok';
  return {status, reasons};
}

function streak(a){
  let n = 0, d = new Date(week);
  while(true){
    const s = assess(rec(iso(d), a)).status;
    if(s === 'flag' || s === 'watch'){ n++; d = addDays(d, -7); } else break;
  }
  return n;
}

const LABEL = {flag:'Flag', watch:'Watch', ok:'On track', part:'Incomplete', none:'No data', leave:'On leave'};

const COLS = `<colgroup><col class="c-name"><col class="c-days"><col class="c-calls"><col class="c-calls"><col class="c-uniq"><col class="c-kpi"><col class="c-kpi"><col class="c-kpi"><col class="c-cq"><col class="c-st"><col class="c-plan"></colgroup>`;
const HEAD = `<thead><tr>
  <th>Adviser</th>
  <th>Days<small>worked</small></th>
  <th>Call attempts<small>min 15 a day</small></th>
  <th>vCITA calls<small>min 10 a day</small></th>
  <th>Unique<small>contacts</small></th>
  <th>Attempted<small>60-day, min 80%</small></th>
  <th>Contacted<small>60-day, min 45%</small></th>
  <th>T1 to T2<small>min 75%</small></th>
  <th>Call Quality<small>tier</small></th>
  <th>Status</th>
  <th>Success plan</th>
</tr></thead>`;

function rowHtml(a, r, status, st){
  const days = num(r.days);
  const expA = days ? MIN_ATTEMPTS * days : null, expV = days ? MIN_VCITA * days : null;
  const shortA = expA !== null && num(r.attempts) !== null && num(r.attempts) < expA;
  const shortV = expV !== null && num(r.vcita) !== null && num(r.vcita) < expV;
  const kcls = f => { const t = tier(f, num(r[f])); return t ? 't-' + t : ''; };
  const cqcls = r.cq === 'Support Needed' ? 't-flag' : r.cq === 'Exceptional Performance' ? 't-exc' : r.cq === 'Achieved Expectations' ? 't-ok' : '';
  const kpi = f => `<span class="f"><input class="num ${kcls(f)}" type="number" min="0" max="100" step="0.1" data-f="${f}" value="${esc(r[f])}"><span class="pct">%</span></span>`;
  return `<tr class="main">
    <td class="name">${esc(a.name)}</td>
    <td><span class="f"><input class="num days" type="number" min="0" max="5" step="0.5" data-f="days" value="${esc(r.days)}"></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="attempts" value="${esc(r.attempts)}"><span class="of ${shortA ? 'short' : ''}">${expA !== null ? '/ ' + expA : ''}</span></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="vcita" value="${esc(r.vcita)}"><span class="of ${shortV ? 'short' : ''}">${expV !== null ? '/ ' + expV : ''}</span></span></td>
    <td><span class="f"><input class="num" type="number" min="0" data-f="unique" value="${esc(r.unique)}"></span></td>
    <td>${kpi('att')}</td><td>${kpi('con')}</td><td>${kpi('t12')}</td>
    <td><select class="${cqcls}" data-f="cq" aria-label="Call Quality tier">${CQ.map(o => `<option value="${o}" ${r.cq === o ? 'selected' : ''}>${CQ_SHORT[o]}</option>`).join('')}</select></td>
    <td><span class="pill ${status}">${LABEL[status]}</span>${st > 1 ? `<span class="streak">${st} weeks in a row</span>` : ''}</td>
    <td><label class="planbox"><input type="checkbox" data-f="plan" ${r.plan ? 'checked' : ''}> Needed</label></td>
  </tr>
  <tr class="noterow"><td></td><td colspan="10"><textarea rows="1" data-f="notes" placeholder="Add notes, risks or agreed actions">${esc(r.notes)}</textarea></td></tr>`;
}

function render(){
  const ae = document.activeElement;
  const keep = ae && ae.dataset && ae.dataset.k ? {k:ae.dataset.k, f:ae.dataset.f} : null;
  const wk = iso(week);
  document.getElementById('weeklabel').textContent = 'Week of ' + fmt(week);
  document.getElementById('weekpick').value = wk;

  const alerts = [];
  const summary = {};
  const partnersEl = document.getElementById('partners');
  partnersEl.innerHTML = '';

  PARTNERS.forEach(p => {
    const list = ADVISERS.filter(a => a.book === p.book);
    const c = summary[p.id] = {flag:0, watch:0, ok:0, plan:0, n:list.length};
    let rows = '';
    list.forEach(a => {
      const r = rec(wk, a);
      const {status, reasons} = assess(r);
      if(c[status] !== undefined) c[status]++;
      if(r.plan) c.plan++;
      const st = (status === 'flag' || status === 'watch') ? streak(a) : 0;
      if(status === 'flag' || status === 'watch') alerts.push({a, p, status, reasons, st, plan:r.plan});
      rows += rowHtml(a, r, status, st);
    });
    const sec = document.createElement('section');
    sec.className = 'partner ' + p.id;
    sec.innerHTML = `<div class="phead"><h2>${p.name}</h2><span class="cnt">${list.length} advisers</span></div>
      <div class="tablewrap"><table>${COLS}${HEAD}<tbody>${rows}</tbody></table></div>`;
    const keys = list.map(a => key(a.name));
    sec.querySelectorAll('tbody tr.main').forEach((tr, i) => {
      [tr, tr.nextElementSibling].forEach(row => row.querySelectorAll('[data-f]').forEach(el => {
        const k = keys[i];
        el.dataset.k = k;
        const ev = (el.tagName === 'TEXTAREA' || el.type === 'number') ? 'input' : 'change';
        el.addEventListener(ev, () => onEdit(k, el));
        if(el.type === 'number') el.addEventListener('change', () => render());
        if(el.tagName === 'TEXTAREA'){ fit(el); el.addEventListener('input', () => fit(el)); }
      }));
    });
    partnersEl.appendChild(sec);
  });

  const stat = (n, l, cls) => `<div class="stat ${cls}"><div class="n ${n ? '' : 'zero'}">${n}</div><div class="l">${l}</div></div>`;
  document.getElementById('overview').innerHTML = PARTNERS.map(p => {
    const c = summary[p.id];
    return `<div class="ov ${p.id}"><h2>${p.name}<span>${c.n} advisers</span></h2><div class="stats">
      ${stat(c.flag, 'Flag', 'flag')}${stat(c.watch, 'Watch', 'watch')}${stat(c.ok, 'On track', 'ok')}${stat(c.plan, 'Success plans', 'plan')}</div></div>`;
  }).join('');

  alerts.sort((x, y) => (x.status === 'flag' ? 0 : 1) - (y.status === 'flag' ? 0 : 1) || PARTNERS.indexOf(x.p) - PARTNERS.indexOf(y.p));
  document.getElementById('alerts').innerHTML = alerts.length
    ? alerts.map(x => `<div class="alert ${x.status}">
        <div class="who">${esc(x.a.name)}<span class="tag ${x.p.id}">${x.p.book}</span></div>
        <div><ul>${[...x.reasons.flag, ...x.reasons.watch].map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        ${x.st > 1 || x.plan ? `<div class="meta">${[x.st > 1 ? x.st + ' weeks in a row' : '', x.plan ? 'Success plan marked as needed' : ''].filter(Boolean).join(' &middot; ')}</div>` : ''}</div>
      </div>`).join('')
    : ADVISERS.every(a => !hasData(rec(wk, a)))
      ? '<div class="empty">No figures entered for this week yet. Type each adviser\'s numbers into the tables below and they save as you go.</div>'
      : '<div class="empty">Nobody is below expectation this week.</div>';
  if(keep){ const el = partnersEl.querySelector(`[data-k="${keep.k}"][data-f="${keep.f}"]`); if(el) el.focus(); }
}

function fit(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }

function onEdit(k, el){
  const wk = iso(week);
  all[wk] = all[wk] || {};
  const r = all[wk][k] = all[wk][k] || {};
  const f = el.dataset.f;
  r[f] = el.type === 'checkbox' ? el.checked : el.value;
  if(el.tagName === 'SELECT' || el.type === 'checkbox') render();
  setSave('Saving...');
  const id = wk + '|' + k;
  pending.add(id);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => persist(wk, k), 600);
}

async function persist(wk, k){
  const id = wk + '|' + k;
  if(store){
    const body = Object.assign({}, all[wk][k], {wk, k});
    chains[id] = (chains[id] || Promise.resolve()).then(() => store.collection('entries').doc(wk + '_' + k).set(body))
      .then(() => { pending.delete(id); setSave('Saved'); })
      .catch(e => setSave(e && e.code === 'invalid_argument' ? 'You have view-only access' : 'Not saved', true));
    return;
  }
  pending.delete(id);
  try{
    const r = await fetch(`${DB}/${wk}/${k}.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(all[wk][k])});
    if(!r.ok) throw new Error(r.status);
    setSave('Saved');
  }catch(e){ setSave('Not saved', true); }
}

function go(d){ week = mondayOf(d); render(); }
document.getElementById('prev').onclick = () => go(addDays(week, -7));
document.getElementById('next').onclick = () => go(addDays(week, 7));
document.getElementById('thisweek').onclick = () => go(new Date());
document.getElementById('refresh').onclick = load;
document.getElementById('weekpick').onchange = e => { if(e.target.value){ const [y,m,d] = e.target.value.split('-').map(Number); go(new Date(y, m-1, d)); } };
document.getElementById('partners').addEventListener('focusout', () => setTimeout(() => { if(dirty && !typing()){ dirty = false; render(); } }, 0));

init();
</script>
</body>
</html>
